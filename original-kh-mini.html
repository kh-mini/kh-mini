<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>kh-mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: fixed 1200x552 landscape stage scaled to fit; every screen is absolutely positioned inside it, party-game style. */
:root{
  color-scheme:dark;
  --ink:#17358a; --navy:#0e2a6e; --blue-1:#1b4ea3; --blue-2:#2f88d8; --blue-3:#58a8ee;
  --paper:#ffffff; --paper-2:#d5e5fb; --lip:#8fb1e8;
  --cyan-1:#a6ecff; --cyan-2:#36b4ea; --cyan-lip:#1f86b8;
  --gold:#ffc83d; --danger:#e8334f;
  --p1:#d9a23b; --p2:#d9534f; --p3:#3b7dd8; --p4:#3aa35c;
  --sand:#d9b46c; --sky:#8ec6e8; --water:#48a2dc; --bar:#161616;
  --font:'Fredoka','Trebuchet MS','Verdana',system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--navy);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1200px;height:552px;transform-origin:0 0;overflow:hidden;background:var(--blue-1)}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block;animation:fadein .28s ease both}
@keyframes fadein{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
.themed{background:linear-gradient(160deg,#1b4ea3 0%,#2a7bd0 70%,#3a94e6 100%)}
.themed::before{content:"";position:absolute;inset:-400px;transform:rotate(45deg);pointer-events:none;
  background:conic-gradient(rgba(255,255,255,.055) 25%,transparent 0 50%,rgba(255,255,255,.055) 0 75%,transparent 0) 0 0/70px 70px}
.themed>*{position:absolute}
.spark{width:var(--s,22px);height:var(--s,22px);fill:#fff;animation:tw 2.6s ease-in-out infinite;animation-delay:var(--d,0s);pointer-events:none}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}

.title{left:0;width:100%;top:28px;text-align:center;font-size:44px;font-weight:700;color:#fff;
  text-shadow:0 3px 0 var(--ink),0 0 16px rgba(10,30,90,.45)}
.title,.sub{pointer-events:none}
.sub{left:0;width:100%;text-align:center;font-size:19px;font-weight:600;color:#e6f1ff}

/* Parallelogram buttons */
.btn{position:relative;display:flex;align-items:center;transform:skewX(-8deg);background:linear-gradient(#fff,var(--paper-2));
  border-radius:14px;box-shadow:0 6px 0 var(--lip),0 12px 20px rgba(5,20,80,.35);transition:transform .08s,box-shadow .08s;
  font-weight:700;letter-spacing:.08em;color:var(--ink);text-transform:uppercase}
.btn>span{display:flex;align-items:center;gap:14px;transform:skewX(8deg);width:100%;justify-content:center;padding:0 20px}
.btn .ic{font-size:36px;line-height:1;letter-spacing:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:skewX(-8deg) translateY(4px);box-shadow:0 2px 0 var(--lip),0 6px 12px rgba(5,20,80,.35)}
.btn.cyan{background:linear-gradient(var(--cyan-1),var(--cyan-2));box-shadow:0 6px 0 var(--cyan-lip),0 12px 20px rgba(5,20,80,.35)}
.btn.cyan:active{box-shadow:0 2px 0 var(--cyan-lip),0 6px 12px rgba(5,20,80,.35)}
.btn.small{height:52px;font-size:17px;padding:0 6px;border-radius:12px}
.btn.small .ic{font-size:22px}
.btn.big{height:72px;font-size:27px}
.btn.disabled{opacity:.55;pointer-events:none}
.round{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 5px 0 var(--lip),0 8px 14px rgba(5,20,80,.3);display:grid;place-items:center;font-size:26px;transition:transform .08s}
.round:active{transform:translateY(3px)}
.backbtn{left:34px;top:26px;width:150px}
.gear{right:34px;top:24px}

/* HOME */
#home .stripe{left:0;top:0;width:650px;height:100%;background:var(--blue-3);clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
#home .left{left:0;top:0;width:620px;height:100%;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);overflow:hidden}
#home .left svg{display:block}
.logo{left:50px;top:34px;font-size:84px;font-weight:700;line-height:1;color:#fff;letter-spacing:-.01em;
  -webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 rgba(10,30,100,.35)}
.chip{left:52px;top:136px;background:#fff;color:var(--ink);font-weight:600;font-size:17px;padding:8px 26px;border-radius:999px;box-shadow:0 4px 0 var(--lip)}
.tools{left:670px;top:22px;display:flex;gap:28px;align-items:flex-start}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-weight:700;font-size:15px;text-shadow:0 2px 0 var(--ink)}
.tool .ti{font-size:44px;line-height:1.1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.star{width:84px;height:84px;border-radius:50%;background:var(--ink);border:5px solid #fff;display:grid;place-items:center;font-size:48px;box-shadow:0 0 0 4px rgba(255,255,255,.25),0 8px 16px rgba(0,0,0,.3)}
.menu{left:670px;top:142px;width:480px}
.menu .btn{height:72px;font-size:26px;margin-bottom:16px}
.soon{position:absolute;right:-6px;top:-14px;background:var(--danger);color:#fff;font-size:12px;letter-spacing:.06em;font-weight:700;padding:3px 10px;border-radius:6px;transform:skewX(8deg) rotate(2deg);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.corner{right:90px;bottom:34px;display:flex;gap:18px}

/* SETTINGS POPUP */
#settings{position:absolute;right:48px;top:86px;width:300px;background:#fff;border-radius:22px;padding:20px 24px 26px;z-index:40;box-shadow:0 14px 30px rgba(0,10,60,.45);display:none;color:var(--ink)}
#settings.open{display:block;animation:pop .18s ease both}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
#settings h3{margin:0 0 14px;font-size:24px}
#settings label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:19px}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;margin:12px 0 0;outline-offset:6px;
  background:linear-gradient(90deg,var(--blue-2) var(--v,50%),#e1e8f6 var(--v,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.switch{width:60px;height:34px;border-radius:99px;background:#c8d3e8;position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:left .15s}
.switch[aria-checked=true]{background:var(--blue-2)}
.switch[aria-checked=true]::after{left:30px}

/* PLAYERS */
.pcards{left:0;width:100%;top:150px;display:flex;justify-content:center;gap:44px}
.pcard{width:218px;height:262px;transform:skewX(-8deg);background:linear-gradient(#fff,var(--paper-2));border-radius:18px;box-shadow:0 8px 0 var(--lip),0 16px 26px rgba(5,20,80,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .1s}
.pcard>*{transform:skewX(8deg)}
.pcard:hover{transform:skewX(-8deg) translateY(-6px)}
.pcard:active{transform:skewX(-8deg) translateY(4px)}
.dots{display:flex;gap:10px;margin-bottom:6px}
.dot{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pcard b{font-size:84px;line-height:1;color:var(--ink);font-weight:700}
.pcard i{font-style:normal;font-size:23px;font-weight:700;color:var(--blue-2)}

/* PICK */
.grid{left:0;width:100%;top:112px;display:grid;grid-template-columns:repeat(4,220px);gap:20px;justify-content:center}
.gcard{height:186px;background:#fff;border-radius:22px;box-shadow:0 7px 0 var(--lip),0 14px 22px rgba(5,20,80,.3);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .1s}
.gcard:hover{transform:translateY(-6px) rotate(-1deg)}
.gcard:active{transform:translateY(2px)}
.gcard .th{height:104px;border-radius:16px;overflow:hidden;background:#cfe0f5}
.gcard .th svg{display:block;width:100%;height:100%}
.gcard b{font-size:23px;color:var(--ink);line-height:1.05}
.gcard small{font-size:15px;color:#5a6f9c;font-weight:500}
.gcard.locked{background:rgba(255,255,255,.28);box-shadow:0 7px 0 rgba(143,177,232,.6);pointer-events:none}
.gcard.locked .th{background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:48px;color:rgba(255,255,255,.45);font-weight:700}
.gcard.locked b{color:#fff;opacity:.85}.gcard.locked small{color:#e3eefc}

/* RANDOM */
.slots{left:0;width:100%;top:168px;display:flex;justify-content:center;gap:22px}
.slot{width:158px;height:214px;border-radius:24px;background:linear-gradient(#fff,#e9f1fd);box-shadow:0 7px 0 var(--lip),0 12px 20px rgba(5,20,80,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px;font-size:20px;color:var(--ink);font-weight:700;text-align:center;transition:transform .12s}
.slot .th{width:100%;height:82px;border-radius:14px;overflow:hidden}
.slot .th svg{width:100%;height:100%;display:block}
.slot small{font-size:14px;font-weight:500;color:#5a6f9c}
.slot.q{background:rgba(255,255,255,.3);box-shadow:none;font-size:72px;color:var(--ink);opacity:.8}
.slot.chosen{outline:6px solid var(--gold);outline-offset:-3px;transform:translateY(-12px) scale(1.06);animation:chose .5s ease both}
@keyframes chose{0%{transform:scale(.8) rotate(-6deg)}60%{transform:translateY(-14px) scale(1.1) rotate(2deg)}100%{transform:translateY(-12px) scale(1.06)}}
.rbtns{left:0;width:100%;top:418px;display:flex;justify-content:center;gap:24px}
.rbtns .btn{width:320px;height:68px;font-size:24px}

/* GAME */
#game{background:#000}
#cv{position:absolute;left:0;top:0;width:1200px;height:552px;display:block}
.capbar{position:absolute;left:0;top:0;width:100%;height:26px;background:var(--bar);color:#e8e8e8;font-size:12.5px;display:flex;align-items:center;z-index:6}
.capbar button{height:26px;padding:0 14px;color:#fff;font-weight:600;font-size:12.5px;background:#333}
.capbar span{flex:1;text-align:center;padding-right:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{position:absolute;width:92px;height:92px;border-radius:50%;border:5px solid rgba(255,255,255,.92);background:var(--c);color:#fff;z-index:5;touch-action:none;
  display:grid;place-items:center;align-content:center;font-weight:700;font-size:28px;line-height:1;box-shadow:0 6px 0 rgba(0,0,0,.28),0 0 0 0 var(--c);transition:transform .06s,opacity .12s}
.pad small{display:none;font-size:11px;font-weight:600;opacity:.85;margin-top:3px;letter-spacing:.05em}
@media (pointer:fine){.pad small{display:block}}
.pad.flip .lbl{transform:rotate(180deg);display:grid;place-items:center}
.pad.hit{transform:scale(.88);box-shadow:0 2px 0 rgba(0,0,0,.28),0 0 0 10px rgba(255,255,255,.28)}
.pad.lock{opacity:.4}
#count{position:absolute;inset:0;display:none;place-items:center;z-index:7;pointer-events:none;color:#fff;font-size:150px;font-weight:700;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.25)}
#count.show{display:grid}
#count span{animation:cnt .75s ease-out both}
@keyframes cnt{from{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}to{transform:scale(1)}}
#banner{position:absolute;left:0;width:100%;top:206px;text-align:center;z-index:7;pointer-events:none;display:none}
#banner.show{display:block;animation:cnt .5s ease-out both}
#banner b{display:block;font-size:68px;font-weight:700;color:var(--bc,#fff);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;line-height:1.05}
#banner i{display:block;font-style:normal;font-size:24px;font-weight:700;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 10px rgba(0,0,0,.4);margin-top:4px}

/* RESULTS + TABLES */
.rrows{left:96px;top:150px;width:470px}
.rrow{display:flex;align-items:center;gap:16px;height:60px;margin-bottom:12px;transform:skewX(-8deg);background:linear-gradient(#fff,var(--paper-2));border-radius:12px;box-shadow:0 5px 0 var(--lip),0 8px 14px rgba(5,20,80,.28);padding:0 24px 0 22px;font-weight:700;font-size:25px;color:var(--ink);animation:rin .45s ease both}
.rrow>*{transform:skewX(8deg)}
.rrow .m{font-size:30px;width:38px}
.rrow .nm{flex:1}
.rrow .pt{font-size:44px;color:var(--blue-2);line-height:1}
.rrow:first-child .pt{color:var(--blue-2)}
@keyframes rin{from{opacity:0;transform:skewX(-8deg) translateX(-40px)}to{opacity:1;transform:skewX(-8deg)}}
.tbl{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 0 var(--lip),0 16px 24px rgba(5,20,80,.3);color:var(--ink)}
.tbl table{width:100%;border-collapse:collapse;font-size:21px;font-variant-numeric:tabular-nums}
.tbl th{background:var(--blue-2);color:#fff;text-align:left;font-weight:700;padding:16px 14px;font-size:20px}
.tbl td{padding:14px;font-weight:700;border-top:1px solid #e6edf8;height:30px}
.tbl td:nth-child(n+4),.tbl th:nth-child(n+4){font-weight:500;text-align:right}
.tbl th:nth-child(n+3),.tbl td:nth-child(n+3){text-align:right}
.tbl td:nth-child(3){text-align:right}
.tbl td:nth-child(2) .dot{display:inline-block;vertical-align:-6px;margin-right:10px;width:22px;height:22px}
.tbl td:first-child,.tbl th:first-child{width:56px;text-align:center;font-weight:500}
.rtbl{left:604px;top:150px;width:520px}
.rbottom{left:0;width:100%;top:454px;display:flex;justify-content:center;gap:26px}
.rbottom .btn{width:290px;height:64px;font-size:21px}
.lbtbl{left:200px;top:112px;width:800px}
.lbnote{left:0;width:100%;top:470px;text-align:center;color:#e6f1ff;font-size:18px;font-weight:600}
.reset{left:36px;bottom:26px;color:#fff;font-weight:600;font-size:15px;background:rgba(10,30,100,.35);padding:9px 16px;border-radius:99px}

#toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-weight:600;font-size:18px;padding:10px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%)}

#rot{position:fixed;inset:0;z-index:80;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-size:22px;font-weight:600}
#rot[hidden]{display:none!important}
#rot .ph{font-size:64px;animation:rotp 2.2s ease-in-out infinite}
@keyframes rotp{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot button{background:#fff;color:var(--ink);padding:12px 26px;border-radius:99px;font-weight:700;font-size:18px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div id="wrap">
<div id="stage">

<!-- HOME -->
<section class="screen themed" id="home" aria-label="Home">
  <div class="stripe"></div>
  <div class="left">
    <svg width="620" height="552" viewBox="0 0 620 552" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d6f5"/><stop offset="1" stop-color="#e4f3fd"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b9be6"/><stop offset="1" stop-color="#1a63b6"/></linearGradient>
        <radialGradient id="glow" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <g id="paddler">
          <path d="M18 108 Q28 152 80 160 L190 160 Q242 150 272 52 Q236 104 202 112 Z" fill="var(--hull)"/>
          <path d="M18 108 L202 114 Q240 110 272 52 Q238 96 200 100 L18 98 Z" fill="var(--hull2)"/>
          <path d="M62 126 L196 134" stroke="#fff" stroke-opacity=".4" stroke-width="5" stroke-linecap="round"/>
          <path d="M150 96 L16 142" stroke="#7a4a22" stroke-width="7" stroke-linecap="round"/>
          <ellipse cx="12" cy="144" rx="8" ry="14" fill="#7a4a22" transform="rotate(20 12 144)"/>
          <ellipse cx="102" cy="100" rx="30" ry="34" fill="var(--body)"/>
          <circle cx="102" cy="52" r="33" fill="var(--body)"/>
          <path d="M69 48 A33 33 0 0 1 135 48 Z" fill="#fbf6ea"/>
          <rect x="69" y="43" width="66" height="11" fill="var(--band)"/>
          <circle cx="90" cy="60" r="8" fill="#fff"/><circle cx="114" cy="60" r="8" fill="#fff"/>
          <circle cx="92" cy="61" r="4" fill="#111"/><circle cx="116" cy="61" r="4" fill="#111"/>
          <path d="M92 76 Q102 85 112 76" stroke="#3a1d10" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
      </defs>
      <rect width="620" height="552" fill="url(#sky)"/>
      <rect width="620" height="552" fill="url(#glow)"/>
      <rect y="272" width="620" height="280" fill="url(#sea)"/>
      <path d="M0 274 Q60 262 120 274 T240 274 T360 274 T480 274 T620 274" stroke="#fff" stroke-opacity=".75" stroke-width="3" fill="none"/>
      <ellipse cx="205" cy="340" rx="150" ry="10" fill="#0e3c80" opacity=".25"/>
      <ellipse cx="420" cy="510" rx="210" ry="14" fill="#0e3c80" opacity=".3"/>
      <use href="#paddler" transform="translate(96 168) scale(.86)" style="--hull:#cf4a46;--hull2:#b83a37;--body:#d9534f;--band:#8a2f2c"/>
      <use href="#paddler" transform="translate(226 306) scale(1.26)" style="--hull:#d9a23b;--hull2:#bd8a2a;--body:#d9a23b;--band:#7d5a26"/>
    </svg>
  </div>
  <h1 class="logo" style="margin:0">kh-mini</h1>
  <div class="chip">Khmer games for 2-4 friends</div>
  <div class="tools">
    <button class="tool" data-act="star" aria-label="Total wins"><span class="star">⭐</span></button>
    <button class="tool" data-act="leaders" style="margin-top:6px"><span class="ti">🏆</span>Leaders</button>
    <button class="tool" data-act="settings" style="margin-top:6px"><span class="ti">⚙️</span>Settings</button>
  </div>
  <div class="menu">
    <button class="btn big" data-act="play" style="margin-left:0"><span><i class="ic">🎮</i>Let's play</span></button>
    <button class="btn big" data-act="surprise" style="margin-left:14px"><span><i class="ic">🎲</i>Surprise me</span></button>
    <button class="btn big" data-act="leaders" style="margin-left:28px"><span><i class="ic">🏆</i>Leaderboard</span></button>
    <button class="btn big cyan" data-act="more" style="margin-left:42px"><span><i class="ic">🧩</i>More games</span><em class="soon">SOON</em></button>
  </div>
  <div class="corner">
    <button class="round" data-act="mute" id="muteBtn" aria-label="Mute sound">🔊</button>
    <button class="round" data-act="share" aria-label="Share game link">📤</button>
  </div>
</section>

<!-- PLAYERS -->
<section class="screen themed" id="players" aria-label="Players">
  <button class="btn small backbtn" data-act="to-home"><span><i class="ic">◀</i>Back</span></button>
  <button class="round gear" data-act="settings" aria-label="Settings">⚙️</button>
  <div class="title" style="top:48px;font-size:46px">How many players?</div>
  <div class="sub" style="top:112px">Grab your friends and pick a number!</div>
  <div class="pcards">
    <button class="pcard" data-n="2"><div class="dots"><span class="dot" style="background:var(--p1)"></span><span class="dot" style="background:var(--p2)"></span></div><b>2P</b><i>Duel!</i></button>

function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}

function musicStart(){
  if(!AC||mTimer)return;
  mNext=AC.currentTime+.15;
  mTimer=setInterval(function(){
    if(!AC||AC.state!=='running')return;
    while(mNext<AC.currentTime+.5){
      var f=SCALE[PAT[mi%16]]*(mi%32>=16?1.5:1),t=mNext;
      var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(1,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);
      o.connect(g);g.connect(mg);o.start(t);o.stop(t+.32);
      if(mi%4===0){var b=AC.createOscillator(),bg=AC.createGain();b.type='sine';b.frequency.value=f/2;
        bg.gain.setValueAtTime(.0001,t);bg.gain.exponentialRampToValueAtTime(1.2,t+.03);bg.gain.exponentialRampToValueAtTime(.0001,t+.8);
        b.connect(bg);bg.connect(mg);b.start(t);b.stop(t+.85)}

function tone(f,d,type,v,t0,slide){
  if(!AC||S.muted||!S.sfx)return;
  var t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);

  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);
}

 tp:'<svg viewBox="0 0 260 130" preserveAspectRatio="xMidYMid slice"><rect width="260" height="130" fill="#8ec6e8"/><rect y="74" width="260" height="56" fill="#d9b46c"/><path d="M20 64H240" stroke="#1a1a1a" stroke-width="3"/><path d="M130 44V64" stroke="#fff" stroke-width="2"/><rect x="130" y="40" width="16" height="9" fill="#d9534f"/>'+stick(108,'#e8a23a',-1)+stick(152,'#d9534f',1)+'</svg>',
 ba:(function(){var s='<svg viewBox="0 0 260 130" preserveAspectRatio="xMidYMid slice"><rect width="260" height="130" fill="#d9b46c"/><circle cx="130" cy="65" r="38" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-dasharray="5 5"/><circle cx="130" cy="65" r="14" fill="#e0a52f" stroke="#fff" stroke-width="3"/>';

/* ---------- game engine ---------- */
var cv=$('#cv'),ctx=cv.getContext('2d');ctx.setTransform(2,0,0,2,0,0);
var G=null;
var PADPOS=[{left:14,bottom:14},{right:14,top:34,flip:1},{right:14,bottom:14},{left:14,top:34,flip:1}];
function buildPads(n){
  var h='';

    var p=PADPOS[i],st='--c:'+PCOL[i]+';';
    ['left','right','top','bottom'].forEach(function(k){if(p[k]!==undefined)st+=k+':'+p[k]+'px;'});

});

  if(!G)return;

  if(G.phase==='count'){
    G.cdT+=dt;
    if(G.cdT>=.75){G.cdT=0;G.cd++;
      if(G.cd>=4){G.phase='play';$('#count').classList.remove('show')}
      else{showCount(COUNT[G.cd]);if(G.cd===3)SFX.go();else SFX.count()}
    }
  }else{G.logic.update(dt)}
  G.logic.draw(ctx);
  if(G.phase==='end'){G.endT-=dt;if(G.endT<=0){var r=G.result,id=G.id;stopGame();finishMatch(r,id);return}}
  G.raf=requestAnimationFrame(frame);
}

/* drawing helpers */

function sortBy(arr,cmp){return arr.slice().sort(cmp)}

var LOGIC={};

/* ---- Teanh Prot (tug of war) ---- */
LOGIC.tp=function(n){
  var team=function(i){return i%2};
  var members=[[],[]];for(var i=0;i<n;i++)members[team(i)].push(i);
  var pw=[members[0].length===1?1.7:1,members[1].length===1?1.7:1];
  var pos=0,shown=0,time=30,taps=[],pull=[];for(i=0;i<n;i++){taps.push(0);pull.push(0)}
  function tname(t){return n===2?PN[members[t][0]]:'Team '+(t+1)}
  function tlabel(t){return 'Team '+(t+1)+' ('+members[t].map(function(p){return PN[p]}).join(', ')+')'}
  function end(wt){
    var ids=[];for(var k=0;k<n;k++)ids.push(k);
    var win=ids.filter(function(p){return team(p)===wt}).sort(function(a,b){return taps[b]-taps[a]});
    var lose=ids.filter(function(p){return team(p)!==wt}).sort(function(a,b){return taps[b]-taps[a]});
    var col=PCOL[members[wt][0]];
    G.finish({rank:win.concat(lose),score:taps.slice(),winners:win,
      banner:tname(wt)+' wins!',color:'#fff',sub:'The flag crosses the line',
      text:(n===2?PN[win[0]]+' wins':tlabel(wt)+' win')+' Teanh Prot!'});
  }
  function drawFig(c,x,t,col,pl,name){
    var s=t?1:-1,sh={x:x+s*(14+22*pl),y:356},hip={x:x,y:402};
    c.lineCap='round';c.lineJoin='round';c.lineWidth=9;c.strokeStyle='rgba(15,40,100,.35)';
    for(var pass=0;pass<2;pass++){
      c.strokeStyle=pass?col:'rgba(23,53,138,.55)';c.lineWidth=pass?6:10;
      c.beginPath();c.moveTo(hip.x,hip.y);c.lineTo(sh.x,sh.y);
      c.moveTo(hip.x,hip.y);c.lineTo(x-s*30,448);c.moveTo(hip.x,hip.y);c.lineTo(x+s*6,448);
      c.moveTo(sh.x,sh.y+4);c.lineTo(x-s*34,324);c.moveTo(sh.x,sh.y+9);c.lineTo(x-s*22,326);c.stroke();
    }
    c.fillStyle=col;c.strokeStyle='rgba(23,53,138,.55)';c.lineWidth=3;c.beginPath();c.arc(sh.x+s*6,338,12,0,7);c.fill();c.stroke();
    txt(c,name,x,470,17,'#fff',NAVY);
  }
  return{
    tap:function(i){
      taps[i]++;pull[i]=1;SFX.tap(i);
      pos+=(team(i)?1:-1)*.034*pw[team(i)];
      if(Math.abs(pos)>=1){pos=pos<0?-1:1;end(pos<0?0:1)}
    },
    update:function(dt){
      for(var i=0;i<n;i++)pull[i]=Math.max(0,pull[i]-dt*4.5);
      shown+=(pos-shown)*Math.min(1,dt*14);
      if(G.phase==='play'){
        time-=dt;
        if(time<=0){var a=0,b=0;members[0].forEach(function(p){a+=taps[p]});members[1].forEach(function(p){b+=taps[p]});
          end(pos<0?0:pos>0?1:(a>=b?0:1))}
      }
    },
    draw:function(c){
      c.fillStyle='#8ec6e8';c.fillRect(0,0,W,H);
      c.fillStyle='rgba(255,255,255,.35)';[[200,100,120],[640,80,150],[980,130,110]].forEach(function(o){c.beginPath();c.ellipse(o[0],o[1],o[2],22,0,0,7);c.fill()});
      c.fillStyle='#d9b46c';c.fillRect(0,372,W,H-372);c.fillStyle='rgba(120,80,20,.12)';c.fillRect(0,372,W,5);
      c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=3;
      [170,1030].forEach(function(x){c.beginPath();c.moveTo(x,26);c.lineTo(x,H);c.stroke()});
      txt(c,tlabel(0),360,62,21,'#fff',NAVY);txt(c,tlabel(1),840,62,21,'#fff',NAVY);
      txt(c,Math.max(0,Math.ceil(time))+'s',600,62,24,'#fff',NAVY);
      c.strokeStyle='#1a1a1a';c.lineWidth=5;c.beginPath();c.moveTo(60,322);c.lineTo(1140,322);c.stroke();
      var fx=600+shown*430;
      c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.moveTo(fx,280);c.lineTo(fx,322);c.stroke();
      c.fillStyle='#e0443f';c.fillRect(fx,278,46,24);c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=2;c.strokeRect(fx,278,46,24);
      for(var t=0;t<2;t++)members[t].forEach(function(p,k){drawFig(c,fx+(t?1:-1)*(74+k*62),t,PCOL[p],pull[p],PN[p])});
    }
  };
};

/* ---- Bos Angkunh (reaction) ---- */
LOGIC.ba=function(n){
  var GOAL=4,score=[],lock=[],rt=[],fs=[];for(var i=0;i<n;i++){score.push(0);lock.push(0);rt.push([]);fs.push(0)}
  var seeds=[];for(var k=0;k<6;k++){var a=(-90+k*60)*Math.PI/180;seeds.push({x:600+Math.cos(a)*250,y:306+Math.sin(a)*140,s:1})}
  var phase='wait',timer=rand(1.3,3),lit=-1,litT=0,fly=null,fx=[],msg='';
  var ORIG=[{x:60,y:492},{x:1140,y:92},{x:1140,y:492},{x:60,y:92}];
  function rand(a,b){return a+Math.random()*(b-a)}
  function next(){phase='wait';timer=rand(1.3,3);lit=-1;msg=''}
  function avg(p){var a=rt[p];return a.length?a.reduce(function(x,y){return x+y},0)/a.length:9999}
  function end(){
    var ids=[];for(var k=0;k<n;k++)ids.push(k);
    var rank=sortBy(ids,function(a,b){return score[b]-score[a]||avg(a)-avg(b)});
    G.finish({rank:rank,score:score.slice(),winners:[rank[0]],banner:PN[rank[0]]+' wins!',color:PCOL[rank[0]],sub:'First to '+GOAL+' seeds',text:PN[rank[0]]+' wins Bos Angkunh!'});
  }
  return{
    tap:function(i){
      if(lock[i]>0)return;
      if(phase==='wait'){lock[i]=1.1;fs[i]++;SFX.bad();msg=PN[i]+' tapped too early!';fx.push({x:ORIG[i].x,y:ORIG[i].y,r:10,a:1,col:'#fff'});return}
      if(phase==='lit'){
        var ms=Math.round(litT*1000);rt[i].push(ms);
        phase='fly';fly={p:i,t:0,fx:ORIG[i].x,fy:ORIG[i].y,tx:seeds[lit].x,ty:seeds[lit].y,ms:ms};SFX.tap(i);
      }
    },
    update:function(dt){
      for(var i=0;i<n;i++){lock[i]=Math.max(0,lock[i]-dt);var el=padEl(i);if(el)el.classList.toggle('lock',lock[i]>0)}
      seeds.forEach(function(s,k){var tgt=(phase==='fly'&&k===lit)?0:1;s.s+=(tgt-s.s)*Math.min(1,dt*9)});
      fx.forEach(function(f){f.r+=dt*180;f.a-=dt*2});fx=fx.filter(function(f){return f.a>0});
      if(G.phase!=='play')return;
      if(phase==='wait'){timer-=dt;if(timer<=0){phase='lit';lit=Math.floor(Math.random()*6);litT=0;SFX.light();msg='NOW!'}}
      else if(phase==='lit'){litT+=dt;if(litT>2.6){msg='Too slow!';phase='res';timer=.8;lit=-1}}
      else if(phase==='fly'){
        fly.t+=dt/.28;
        if(fly.t>=1){score[fly.p]++;SFX.hit();fx.push({x:fly.tx,y:fly.ty,r:20,a:1,col:PCOL[fly.p]});
          msg=PN[fly.p]+' +1  ·  '+fly.ms+' ms';phase='res';timer=1;
          if(score[fly.p]>=GOAL){end()}
        }
      }
      else if(phase==='res'){timer-=dt;if(timer<=0){lit=-1;next()}}
    },
    draw:function(c){
      var g=c.createRadialGradient(600,300,60,600,300,720);g.addColorStop(0,'#e6c382');g.addColorStop(1,'#bf914a');
      c.fillStyle=g;c.fillRect(0,0,W,H);
      c.strokeStyle='rgba(120,80,20,.14)';c.lineWidth=3;for(var r=120;r<760;r+=110){c.beginPath();c.ellipse(600,306,r*1.2,r*.7,0,0,7);c.stroke()}
      c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=3;c.setLineDash([9,9]);c.beginPath();c.ellipse(600,306,150,90,0,0,7);c.stroke();c.setLineDash([]);
      /* center angkunh */
      c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(600,318,34,12,0,0,7);c.fill();
      c.fillStyle='#e0a52f';c.strokeStyle='#fff';c.lineWidth=5;c.beginPath();c.arc(600,306,30,0,7);c.fill();c.stroke();
      c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.arc(590,296,9,0,7);c.fill();
      seeds.forEach(function(s,k){
        if(s.s<.02)return;var on=(k===lit&&phase==='lit');
        if(on){var p=.5+.5*Math.sin(litT*18);var gr=c.createRadialGradient(s.x,s.y,6,s.x,s.y,70);gr.addColorStop(0,'rgba(255,230,90,.95)');gr.addColorStop(1,'rgba(255,230,90,0)');c.fillStyle=gr;c.beginPath();c.arc(s.x,s.y,70+p*10,0,7);c.fill()}
        c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(s.x+3,s.y+int(22*s.s),22*s.s,8*s.s,0,0,7);c.fill();
        c.fillStyle=on?'#ffcf3a':'#7a3f1c';c.beginPath();c.arc(s.x,s.y,22*s.s,0,7);c.fill();
        c.fillStyle='rgba(255,255,255,.3)';c.beginPath();c.arc(s.x-7*s.s,s.y-7*s.s,6*s.s,0,7);c.fill();
        if(on){c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.arc(s.x,s.y,22+p*12,0,7);c.stroke()}
      });
      function int(v){return Math.round(v)}
      fx.forEach(function(f){c.globalAlpha=Math.max(0,f.a);c.strokeStyle=f.col;c.lineWidth=6;c.beginPath();c.arc(f.x,f.y,f.r,0,7);c.stroke();c.globalAlpha=1});
      if(fly){var t=Math.min(1,fly.t),x=fly.fx+(fly.tx-fly.fx)*t,y=fly.fy+(fly.ty-fly.fy)*t-Math.sin(t*Math.PI)*70;
        if(phase==='fly'){c.fillStyle='#e0a52f';c.strokeStyle=PCOL[fly.p];c.lineWidth=6;c.beginPath();c.arc(x,y,17,0,7);c.fill();c.stroke()}}
      /* scoreboard */
      var w=n*130,x0=600-w/2;
      for(var i=0;i<n;i++){
        var cx=x0+i*130+65;c.fillStyle='rgba(255,255,255,.88)';rrect(c,cx-60,38,120,44,22);c.fill();
        c.fillStyle=PCOL[i];c.beginPath();c.arc(cx-38,60,13,0,7);c.fill();
        for(var q=0;q<GOAL;q++){c.fillStyle=q<score[i]?PCOL[i]:'rgba(23,53,138,.2)';c.beginPath();c.arc(cx-12+q*17,60,6,0,7);c.fill()}
      }
      var m=phase==='lit'?'NOW!':(phase==='wait'?(msg||'Wait for it…'):msg);
      txt(c,m,600,118,phase==='lit'?58:30,phase==='lit'?'#fff':'#fff',phase==='lit'?'#c0392b':'#7a4a1a');
    }
  };
};

/* ---- Oum Touk (rowing race) ---- */
LOGIC.ot=function(n){
  var prog=[],disp=[],taps=[],row=[],spd=[];for(var i=0;i<n;i++){prog.push(0);disp.push(0);taps.push(0);row.push(0);spd.push(0)}
  var laneH=Math.min(132,500/n),y0=26+(526-laneH*n)/2;
  function end(){
    var ids=[];for(var k=0;k<n;k++)ids.push(k);
    var rank=sortBy(ids,function(a,b){return prog[b]-prog[a]||taps[b]-taps[a]});
    G.finish({rank:rank,score:taps.slice(),winners:[rank[0]],banner:PN[rank[0]]+' wins!',color:PCOL[rank[0]],sub:'First across the line',text:PN[rank[0]]+' wins Oum Touk!'});
  }
  return{
    tap:function(i){
      taps[i]++;row[i]+=1.1;SFX.tap(i);prog[i]=Math.min(1,prog[i]+.021);
      if(prog[i]>=1)end();
    },
    update:function(dt){for(var i=0;i<n;i++){var d=(prog[i]-disp[i])*Math.min(1,dt*10);disp[i]+=d;spd[i]+=((d/Math.max(dt,.001))-spd[i])*Math.min(1,dt*8)}},
    draw:function(c){
      c.fillStyle='#48a2dc';c.fillRect(0,0,W,H);
      for(var i=0;i<n;i++){c.fillStyle=i%2?'rgba(255,255,255,.07)':'rgba(0,40,120,.07)';c.fillRect(0,y0+i*laneH,W,laneH)}
      c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=2;
      for(i=0;i<=n;i++){c.beginPath();c.moveTo(0,y0+i*laneH);c.lineTo(W,y0+i*laneH);c.stroke()}
      c.fillStyle='#fff';c.fillRect(1060,26,5,H);
      c.fillStyle='#8a4a1e';rrect(c,1090,y0+laneH*Math.min(1,n-1)+laneH/2-26,26,52,5);c.fill();
      for(i=0;i<n;i++){
        var cy=y0+i*laneH+laneH/2,nose=300+disp[i]*740;
        txt(c,PN[i],140,cy,28,'#fff',NAVY);
        c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=3;c.lineCap='round';
        var wl=30+Math.min(80,Math.abs(spd[i])*.25);
        for(var k=-1;k<=1;k++){c.beginPath();c.moveTo(nose-128,cy+k*9+6);c.lineTo(nose-128-wl,cy+k*9+6);c.stroke()}
        c.fillStyle=PCOL[i];c.beginPath();
        c.moveTo(nose-124,cy-2);c.lineTo(nose-4,cy-2);c.quadraticCurveTo(nose+24,cy-4,nose+40,cy-26);c.quadraticCurveTo(nose+22,cy+14,nose-4,cy+14);c.lineTo(nose-124,cy+14);c.closePath();c.fill();
        c.fillStyle='rgba(255,255,255,.3)';c.fillRect(nose-110,cy+3,100,3);
        c.fillStyle='#111';
        for(k=0;k<5;k++){var bob=Math.sin(row[i]*2.4+k*.7)*3.5;c.beginPath();c.arc(nose-104+k*22,cy-10+bob,6.5,0,7);c.fill()}
      }
    }
  };
};

/* ---------- results + leaderboard ---------- */
var BASE=[10,7,5,3],MEDAL=['🥇','🥈','🥉','🎈'];
function tableHTML(){
  var ids=[0,1,2,3].sort(function(a,b){return LB[b].p-LB[a].p||LB[b].w-LB[a].w||a-b});
  var h='<table><thead><tr><th>#</th><th>Player</th><th>Points</th><th>Wins</th><th>Games</th></tr></thead><tbody>';
  ids.forEach(function(p,r){
    var played=LB[p].g>0;
    h+='<tr><td>'+(played&&r<3?['🥇','🥈','🥉'][r]:r+1)+'</td><td><span class="dot" style="background:'+PCOL[p]+'"></span>'+PN[p]+'</td><td>'+LB[p].p+'</td><td>'+LB[p].w+'</td><td>'+LB[p].g+'</td></tr>';
  });
  return h+'</tbody></table>';
}
function renderLB(){
  $('#lbTbl').innerHTML=tableHTML();
  var any=LB.some(function(x){return x.g>0});
  $('#lbNote').textContent=any?'':'Play a match and your points show up here.';
}
function finishMatch(res,id){
  var n=res.rank.length,maxS=Math.max.apply(null,res.score.concat([1])),pts=[];
  res.rank.forEach(function(p,r){pts[p]=BASE[r]+Math.round(4*res.score[p]/maxS);LB[p].p+=pts[p];LB[p].g++});
  res.winners.forEach(function(p){LB[p].w++});lbSave();
  $('#resSub').textContent=res.text+' 👑';
  var h='';res.rank.forEach(function(p,r){
    h+='<div class="rrow" style="animation-delay:'+(r*.1)+'s"><span class="m">'+MEDAL[r]+'</span><span class="dot" style="background:'+PCOL[p]+'"></span><span class="nm">'+PN[p]+'</span><span class="pt">'+pts[p]+'</span></div>';
  });
  $('#resRows').innerHTML=h;$('#resTbl').innerHTML=tableHTML();
  go('results');
}

/* ---------- settings ---------- */
function syncSettings(){
  var v=Math.round(S.music*100);$('#vol').value=v;$('#vol').style.setProperty('--v',v+'%');
  $('#sfx').setAttribute('aria-checked',S.sfx);$('#muteBtn').textContent=S.muted?'🔇':'🔊';applyVol();
}
$('#vol').addEventListener('input',function(e){S.music=e.target.value/100;e.target.style.setProperty('--v',e.target.value+'%');applyVol();saveS()});
$('#sfx').addEventListener('click',function(){S.sfx=!S.sfx;syncSettings();saveS();SFX.click()});
syncSettings();

/* ---------- clicks ---------- */
document.addEventListener('pointerdown',function(){audioInit()},{once:false,passive:true});
document.addEventListener('click',function(e){
  var st=$('#settings');
  if(st.classList.contains('open')&&!e.target.closest('#settings')&&!e.target.closest('[data-act="settings"]'))st.classList.remove('open');
  var pc=e.target.closest('.pcard');
  if(pc){SFX.click();nPlayers=+pc.dataset.n;if(flow==='random'){randomReset();go('random')}else go('pick');return}
  var gc=e.target.closest('.gcard[data-g]');
  if(gc){SFX.click();startGame(gc.dataset.g);return}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;if(a!=='quit')SFX.click();
  switch(a){
    case 'play':flow='pick';go('players');break;
    case 'surprise':flow='random';go('players');break;
    case 'surprise-now':randomReset();flow='random';go('random');break;
    case 'leaders':go('leaders');break;
    case 'settings':st.classList.toggle('open');break;
    case 'more':toast('More games are coming soon!');break;
    case 'star':toast('⭐ '+LB.reduce(function(s,x){return s+x.w},0)+' matches won so far');break;
    case 'mute':S.muted=!S.muted;syncSettings();saveS();break;
    case 'share':
      try{navigator.clipboard.writeText(location.href).then(function(){toast('Game link copied!')},function(){toast('Copy the link from your address bar')})}catch(err){toast('Copy the link from your address bar')}break;
    case 'to-home':go('home');break;
    case 'to-players':clearInterval(shuffleIv);go('players');break;
    case 'shuffle':doShuffle();break;
    case 'letsgo':if(chosen)startGame(chosen.id);break;
    case 'quit':go(flow==='random'?'random':'pick');if(flow==='random')randomReset();break;
    case 'again':startGame(lastGame);break;
    case 'another':if(flow==='random'){randomReset();go('random')}else go('pick');break;
    case 'reset':LB=[0,1,2,3].map(function(){return{p:0,w:0,g:0}});lbSave();renderLB();toast('Scores cleared');break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#settings').classList.remove('open')});

/* ---------- fit to screen ---------- */
var rotDismissed=false,wrap=$('#wrap'),stage=$('#stage');
function fit(){
  var w=wrap.clientWidth,h=wrap.clientHeight,s=Math.min(w/W,h/H);
  stage.style.transform='translate('+((w-W*s)/2)+'px,'+((h-H*s)/2)+'px) scale('+s+')';
  $('#rot').hidden=!(h>w*1.05&&!rotDismissed);
}
$('#rotOk').addEventListener('click',function(){rotDismissed=true;fit()});
window.addEventListener('resize',fit);fit();
go('home');
})();
</script>
